<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Skills</title>
<style>
  :root {
    --bg: #f4f3f0;
    --panel: #ffffff;
    --panel-2: #efeeea;
    --border: #e2e1dc;
    --border-strong: #d3d2cc;
    --text: #232220;
    --muted: #76736c;
    --accent: #b5502e;
    --accent-soft: #f3e6df;
    --ok: #3f7a54;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --panel: #211f1d;
      --panel-2: #2a2825;
      --border: #35332f;
      --border-strong: #423f3a;
      --text: #ece9e3;
      --muted: #9c988f;
      --accent: #e0764f;
      --accent-soft: #392922;
      --ok: #6bb085;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  /* Sidebar / nav */
  aside {
    width: 288px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .brand { padding: 20px 20px 14px; border-bottom: 1px solid var(--border); }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .nav { flex: 1; overflow-y: auto; padding: 12px; }
  .group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 16px 8px 6px; font-weight: 700;
  }
  .group-label:first-child { margin-top: 2px; }
  .tool {
    display: flex; gap: 11px; align-items: center; padding: 9px 11px;
    border-radius: 10px; cursor: pointer; border: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .tool:hover { background: var(--panel-2); }
  .tool.active { background: var(--accent-soft); border-color: var(--accent); }
  .tool .emoji { font-size: 18px; }
  .tool .name { font-size: 13.5px; font-weight: 600; }
  .tool .tag { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .nav-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }

  /* Workspace */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--panel);
    padding: 18px 30px; display: flex; align-items: center; gap: 14px;
  }
  .topbar .emoji { font-size: 26px; }
  .topbar .t-name { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .topbar .t-blurb { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .topbar .spacer { flex: 1; }
  .pill {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  }

  .banner { background: var(--accent-soft); border-bottom: 1px solid var(--accent); padding: 9px 30px; font-size: 13px; }

  .scroll { flex: 1; overflow-y: auto; }
  .canvas { max-width: 880px; margin: 0 auto; padding: 26px 30px 60px; }

  /* Brief panel */
  .brief {
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 18px 16px;
  }
  .brief-label { font-size: 12.5px; font-weight: 700; letter-spacing: .01em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .brief-label .sub { font-weight: 400; color: var(--muted); }
  textarea#brief {
    width: 100%; border: 1px solid var(--border); border-radius: 11px; background: var(--bg);
    color: var(--text); font: inherit; font-size: 14.5px; line-height: 1.55; padding: 13px 14px;
    resize: vertical; min-height: 120px; outline: none;
  }
  textarea#brief:focus { border-color: var(--accent); }
  .brief-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .run {
    font: inherit; font-size: 14px; font-weight: 650; padding: 11px 22px; border-radius: 11px;
    border: none; background: var(--accent); color: #fff; cursor: pointer; display: inline-flex;
    align-items: center; gap: 8px; transition: opacity .12s, transform .05s;
  }
  .run:hover { filter: brightness(1.04); }
  .run:active { transform: translateY(1px); }
  .run:disabled { opacity: .5; cursor: default; }
  .run .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brief-actions .note { font-size: 12px; color: var(--muted); }
  .brief-actions .clear { margin-left: auto; font-size: 12.5px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .brief-actions .clear:hover { color: var(--text); }

  .examples { margin-top: 14px; }
  .examples .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    max-width: 100%; text-align: left; transition: border-color .12s;
  }
  .chip:hover { border-color: var(--accent); }

  /* Runs */
  .runs { margin-top: 26px; display: flex; flex-direction: column; gap: 18px; }
  .runs-head { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .card-head .idx { font-size: 11px; font-weight: 700; color: var(--muted); }
  .card-head .brief-text { font-size: 13px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head .status { font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .status.running { color: var(--accent); }
  .status.done { color: var(--ok); }
  .status.err { color: var(--accent); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.running .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .card-body { padding: 18px 20px; }
  .placeholder { color: var(--muted); font-style: italic; }

  .files { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; flex-wrap: wrap; gap: 8px; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 9px; text-decoration: none;
    background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent);
    padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
  }
  .file-chip:hover { filter: brightness(1.03); }
  .file-chip .dl { color: var(--accent); font-weight: 700; }

  /* Rendered markdown (document-style output) */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md { font-size: 14.5px; line-height: 1.65; }
  .md p { margin: 0 0 11px; }
  .md h1, .md h2, .md h3 { margin: 18px 0 9px; line-height: 1.3; letter-spacing: -.01em; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md ul, .md ol { margin: 0 0 11px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { background: var(--panel-2); padding: 1.5px 5px; border-radius: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .md pre { background: var(--panel-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 0 0 11px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; width: 100%; margin: 0 0 12px; font-size: 13.5px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border-strong); padding: 6px 10px; text-align: left; }
  .md th { background: var(--panel-2); font-weight: 600; }
  .md a { color: var(--accent); }
  .md blockquote { margin: 0 0 11px; padding-left: 12px; border-left: 3px solid var(--border-strong); color: var(--muted); }

  .empty-hint { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 30px; padding: 24px; border: 1px dashed var(--border); border-radius: var(--radius); }

  @media (max-width: 820px) { aside { display: none; } .canvas { padding: 20px 18px 50px; } }
</style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>Team Skills</h1>
      <p>Pick a tool, write a brief, run it.</p>
    </div>
    <div class="nav" id="nav"></div>
    <div class="nav-foot">Powered by Claude</div>
  </aside>

  <main>
    <div class="topbar">
      <span class="emoji" id="tEmoji">💬</span>
      <div>
        <div class="t-name" id="tName">Team Skills</div>
        <div class="t-blurb" id="tBlurb">Select a tool to begin.</div>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="tPill"></span>
    </div>

    <div class="banner" id="banner" style="display:none"></div>

    <div class="scroll">
      <div class="canvas">
        <div class="brief">
          <div class="brief-label">Brief <span class="sub" id="briefSub">— describe what you want</span></div>
          <textarea id="brief" placeholder="Describe the task…"></textarea>
          <div class="brief-actions">
            <button class="run" id="runBtn">Run ▸</button>
            <span class="note" id="runNote"></span>
            <button class="clear" id="clearBtn" style="display:none">Clear runs</button>
          </div>
          <div class="examples" id="examples"></div>
        </div>

        <div class="runs" id="runs"></div>
      </div>
    </div>
  </main>

<script>
const state = { skills: [], current: null, sessionId: null, running: false, runCount: 0 };

state.sessionId = localStorage.getItem("ts_session");
if (!state.sessionId) {
  state.sessionId = "s_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("ts_session", state.sessionId);
}

const el = (id) => document.getElementById(id);
const brief = el("brief");
const runsEl = el("runs");

// ---------- tiny, safe markdown renderer ----------
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,(_,c)=>"<code>"+c+"</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMd(text){
  const lines = text.split("\n"); let html="", i=0;
  while(i<lines.length){
    let line = lines[i];
    if(/^```/.test(line)){ let code=[]; i++; while(i<lines.length&&!/^```/.test(lines[i])){code.push(lines[i]);i++;} i++; html+="<pre><code>"+esc(code.join("\n"))+"</code></pre>"; continue; }
    if(line.includes("|")&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes("-")){
      const parseRow=(r)=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const headers=parseRow(line); i+=2; let rows=[];
      while(i<lines.length&&lines[i].includes("|")){rows.push(parseRow(lines[i]));i++;}
      html+="<table><thead><tr>"+headers.map(h=>"<th>"+inlineMd(h)+"</th>").join("")+"</tr></thead><tbody>";
      html+=rows.map(r=>"<tr>"+r.map(c=>"<td>"+inlineMd(c)+"</td>").join("")+"</tr>").join("");
      html+="</tbody></table>"; continue;
    }
    let m=line.match(/^(#{1,3})\s+(.*)$/);
    if(m){const lvl=m[1].length; html+=`<h${lvl}>`+inlineMd(m[2])+`</h${lvl}>`; i++; continue;}
    if(/^>\s?/.test(line)){let q=[]; while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++;} html+="<blockquote>"+inlineMd(q.join(" "))+"</blockquote>"; continue;}
    if(/^\s*[-*]\s+/.test(line)){let it=[]; while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;} html+="<ul>"+it.map(x=>"<li>"+inlineMd(x)+"</li>").join("")+"</ul>"; continue;}
    if(/^\s*\d+\.\s+/.test(line)){let it=[]; while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++;} html+="<ol>"+it.map(x=>"<li>"+inlineMd(x)+"</li>").join("")+"</ol>"; continue;}
    if(line.trim()===""){i++; continue;}
    let para=[line]; i++;
    while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,3}\s|[-*]\s|\d+\.\s|>|```)/.test(lines[i])&&!lines[i].includes("|")){para.push(lines[i]);i++;}
    html+="<p>"+inlineMd(para.join("\n"))+"</p>";
  }
  return html;
}

// ---------- nav ----------
function renderNav(){
  const nav = el("nav"); nav.innerHTML = "";
  const groups = [
    ["Assistants", state.skills.filter(s=>s.type==="prompt")],
    ["Document builders", state.skills.filter(s=>s.type==="document")],
  ];
  for(const [label, items] of groups){
    if(!items.length) continue;
    const l=document.createElement("div"); l.className="group-label"; l.textContent=label; nav.appendChild(l);
    for(const s of items){
      const d=document.createElement("div");
      d.className="tool"+(state.current&&state.current.id===s.id?" active":"");
      d.innerHTML=`<span class="emoji">${s.emoji}</span><div><div class="name">${s.name}</div><div class="tag">${s.produces_files?"Produces a file":"Text output"}</div></div>`;
      d.onclick=()=>selectSkill(s.id);
      nav.appendChild(d);
    }
  }
}

function selectSkill(id){
  const s = state.skills.find(x=>x.id===id); if(!s) return;
  state.current = s; state.runCount = 0;
  el("tEmoji").textContent = s.emoji;
  el("tName").textContent = s.name;
  el("tBlurb").textContent = s.blurb;
  el("tPill").textContent = s.produces_files ? "Produces a downloadable file" : "Text output";
  el("briefSub").textContent = s.produces_files ? "— describe the document you want built" : "— describe what you want";
  brief.placeholder = "Describe the task for " + s.name + "…";
  el("runNote").textContent = s.produces_files ? "The generated file will appear below to download." : "⌘/Ctrl + Enter to run";
  runsEl.innerHTML = "";
  showEmptyHint();
  renderExamples();
  renderNav();
  brief.focus();
}

function renderExamples(){
  const box = el("examples"); const s = state.current;
  const starters = s.starters || [];
  if(!starters.length){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="lbl">Try</div><div class="chips">` +
    starters.map((t,idx)=>`<button class="chip" data-i="${idx}">${esc(t)}</button>`).join("") + `</div>`;
  box.querySelectorAll(".chip").forEach(b=>{
    b.onclick=()=>{ brief.value = s.starters[b.dataset.i]; brief.focus(); brief.scrollTop=0; };
  });
}

function showEmptyHint(){
  el("clearBtn").style.display = "none";
  if(runsEl.querySelector(".card")) return;
  runsEl.innerHTML = `<div class="empty-hint">No runs yet — write a brief above and hit <strong>Run</strong>.</div>`;
}

// ---------- run ----------
function newCard(briefText){
  const hint = runsEl.querySelector(".empty-hint"); if(hint) hint.remove();
  el("clearBtn").style.display = "inline";
  if(!runsEl.querySelector(".runs-head")){
    const h=document.createElement("div"); h.className="runs-head"; h.textContent="Runs"; runsEl.prepend(h);
  }
  state.runCount++;
  const card=document.createElement("div"); card.className="card";
  card.innerHTML = `
    <div class="card-head">
      <span class="idx">RUN ${state.runCount}</span>
      <span class="brief-text">${esc(briefText)}</span>
      <span class="status running"><span class="dot"></span>Working…</span>
    </div>
    <div class="card-body"><div class="out placeholder">Starting…</div></div>`;
  // insert newest at top (just under the "Runs" header)
  const head = runsEl.querySelector(".runs-head");
  head.after(card);
  return card;
}

async function run(){
  if(state.running || !state.current) return;
  const text = brief.value.trim(); if(!text) return;

  const card = newCard(text);
  const out = card.querySelector(".out");
  const status = card.querySelector(".status");
  brief.value = "";

  state.running = true;
  const btn = el("runBtn");
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Running`;

  let acc=""; let started=false; const files=[];
  try{
    const resp = await fetch("/api/chat",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: state.sessionId, skill_id: state.current.id, message: text}),
    });
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true}); let idx;
      while((idx=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const line=chunk.replace(/^data: /,""); if(!line) continue;
        let ev; try{ev=JSON.parse(line);}catch{continue;}
        if(ev.type==="text"){
          if(!started){started=true; acc=""; out.classList.remove("placeholder");}
          acc+=ev.text; out.innerHTML='<div class="md">'+renderMd(acc)+"</div>";
        } else if(ev.type==="file"){
          files.push(ev);
        } else if(ev.type==="error"){
          out.classList.remove("placeholder");
          out.innerHTML='<div class="md" style="color:var(--accent)">⚠️ '+esc(ev.message)+"</div>";
          status.className="status err"; status.innerHTML='<span class="dot"></span>Failed';
        }
      }
    }
  }catch(e){
    out.classList.remove("placeholder");
    out.innerHTML='<div class="md" style="color:var(--accent)">⚠️ Connection error: '+esc(String(e))+"</div>";
    status.className="status err"; status.innerHTML='<span class="dot"></span>Failed';
  }finally{
    if(files.length){
      const w=document.createElement("div"); w.className="files";
      for(const f of files){
        const a=document.createElement("a"); a.className="file-chip";
        a.href="/api/files/"+encodeURIComponent(f.file_id); a.setAttribute("download",f.name);
        a.innerHTML=`<span>📎 ${esc(f.name)}</span><span class="dl">Download</span>`;
        w.appendChild(a);
      }
      card.querySelector(".card-body").appendChild(w);
    }
    if(!started && !out.querySelector(".md")){ out.innerHTML='<div class="md" style="color:var(--muted)">(no output)</div>'; }
    if(status.classList.contains("running")){ status.className="status done"; status.innerHTML='<span class="dot"></span>Done'; }
    state.running=false; btn.disabled=false; btn.innerHTML="Run ▸";
  }
}

// ---------- input ----------
brief.addEventListener("keydown",(e)=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); run(); }});
el("runBtn").onclick = run;
el("clearBtn").onclick = async ()=>{
  if(!state.current) return;
  await fetch("/api/reset",{method:"POST",headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session_id: state.sessionId, skill_id: state.current.id})});
  state.runCount = 0; runsEl.innerHTML=""; showEmptyHint();
};

// ---------- boot ----------
async function boot(){
  const resp = await fetch("/api/skills"); const data = await resp.json();
  state.skills = data.skills;
  if(!data.configured){
    const b=el("banner"); b.style.display="block";
    b.textContent="⚠️ No ANTHROPIC_API_KEY configured on the server — runs will not work until it is set.";
  }
  renderNav();
  if(state.skills.length) selectSkill(state.skills[0].id);
}
boot();
</script>
</body>
</html>
