<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Skills</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #ffffff; --panel-2: #efeeea; --border: #e2e1dc; --border-strong: #d3d2cc;
    --text: #232220; --muted: #76736c; --accent: #b5502e; --accent-soft: #f3e6df; --ok: #3f7a54;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.05); --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #211f1d; --panel-2: #2a2825; --border: #35332f; --border-strong: #423f3a;
      --text: #ece9e3; --muted: #9c988f; --accent: #e0764f; --accent-soft: #392922; --ok: #6bb085;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  aside { width: 288px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .brand { padding: 20px 20px 14px; border-bottom: 1px solid var(--border); }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .nav { flex: 1; overflow-y: auto; padding: 12px; }
  .group-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 8px 6px; font-weight: 700; }
  .group-label:first-child { margin-top: 2px; }
  .tool { display: flex; gap: 11px; align-items: center; padding: 9px 11px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: background .12s, border-color .12s; }
  .tool:hover { background: var(--panel-2); }
  .tool.active { background: var(--accent-soft); border-color: var(--accent); }
  .tool .emoji { font-size: 18px; }
  .tool .name { font-size: 13.5px; font-weight: 600; }
  .tool .tag { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .nav-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--panel); padding: 18px 30px; display: flex; align-items: center; gap: 14px; }
  .topbar .emoji { font-size: 26px; }
  .topbar .t-name { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .topbar .t-blurb { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .topbar .spacer { flex: 1; }
  .pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  .banner { background: var(--accent-soft); border-bottom: 1px solid var(--accent); padding: 9px 30px; font-size: 13px; }

  .scroll { flex: 1; overflow-y: auto; }
  .canvas { max-width: 900px; margin: 0 auto; padding: 26px 30px 60px; }

  .form { background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }
  .field-label { font-size: 12.5px; font-weight: 700; margin-bottom: 3px; display: flex; align-items: baseline; gap: 8px; }
  .field-label .req { color: var(--accent); font-size: 11px; font-weight: 700; }
  .field-help { font-size: 12px; color: var(--muted); margin-bottom: 9px; line-height: 1.45; }

  .drop {
    border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 20px; text-align: center;
    cursor: pointer; transition: border-color .12s, background .12s; background: var(--bg);
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .icon { font-size: 22px; }
  .drop .lead { font-size: 13px; margin-top: 4px; }
  .drop .lead b { color: var(--accent); }
  .drop .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  .filelist { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .filerow { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; font-size: 13px; }
  .filerow .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filerow .sz { color: var(--muted); font-size: 12px; }
  .filerow .x { cursor: pointer; color: var(--muted); border: none; background: none; font-size: 16px; line-height: 1; padding: 0 2px; }
  .filerow .x:hover { color: var(--accent); }

  textarea#instr {
    width: 100%; border: 1px solid var(--border); border-radius: 11px; background: var(--bg); color: var(--text);
    font: inherit; font-size: 14px; line-height: 1.55; padding: 12px 13px; resize: vertical; min-height: 90px; outline: none;
  }
  textarea#instr:focus { border-color: var(--accent); }

  .form-foot { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .run { font: inherit; font-size: 14px; font-weight: 650; padding: 11px 24px; border-radius: 11px; border: none; background: var(--accent); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: filter .12s, transform .05s; }
  .run:hover { filter: brightness(1.04); } .run:active { transform: translateY(1px); }
  .run:disabled { opacity: .45; cursor: default; }
  .run .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .deliverable { font-size: 12.5px; color: var(--muted); }
  .deliverable b { color: var(--text); font-weight: 600; }
  .form-foot .clear { margin-left: auto; font-size: 12.5px; color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; }
  .form-foot .clear:hover { color: var(--text); }

  .examples { margin-top: 14px; }
  .examples .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); text-align: left; transition: border-color .12s; }
  .chip:hover { border-color: var(--accent); }

  .runs { margin-top: 26px; display: flex; flex-direction: column; gap: 18px; }
  .runs-head { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  .card-head .idx { font-size: 11px; font-weight: 700; color: var(--muted); }
  .card-head .brief-text { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head .status { font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .status.running { color: var(--accent); } .status.done { color: var(--ok); } .status.err { color: var(--accent); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.running .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .card-body { padding: 18px 20px; }
  .statusline { color: var(--muted); font-style: italic; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .card-inputs { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .card-inputs .ic { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; margin: 0 4px 4px 0; }

  .files { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .files .flabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-bottom: 9px; }
  .files .wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .file-chip { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .file-chip:hover { filter: brightness(1.03); }
  .file-chip .dl { color: var(--accent); font-weight: 700; }

  .md { font-size: 14px; line-height: 1.6; }
  .md > *:first-child { margin-top: 0; } .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3 { margin: 16px 0 8px; line-height: 1.3; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; }
  .md code { background: var(--panel-2); padding: 1.5px 5px; border-radius: 5px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .md pre { background: var(--panel-2); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 0 0 10px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; width: 100%; margin: 0 0 12px; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border-strong); padding: 6px 10px; text-align: left; }
  .md th { background: var(--panel-2); font-weight: 600; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--border-strong); color: var(--muted); }

  .empty-hint { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 26px; padding: 22px; border: 1px dashed var(--border); border-radius: var(--radius); }

  @media (max-width: 820px) { aside { display: none; } .canvas { padding: 20px 16px 50px; } }
</style>
</head>
<body>
  <aside>
    <div class="brand"><h1>Team Skills</h1><p>Pick a tool, add files, run it.</p></div>
    <div class="nav" id="nav"></div>
    <div class="nav-foot">Powered by Claude</div>
  </aside>

  <main>
    <div class="topbar">
      <span class="emoji" id="tEmoji">📐</span>
      <div>
        <div class="t-name" id="tName">Team Skills</div>
        <div class="t-blurb" id="tBlurb">Select a tool to begin.</div>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="tPill"></span>
    </div>

    <div class="banner" id="banner" style="display:none"></div>

    <div class="scroll">
      <div class="canvas">
        <div class="form" id="form"></div>
        <div class="runs" id="runs"></div>
      </div>
    </div>
  </main>

<script>
const state = { skills: [], current: null, sessionId: null, running: false, runCount: 0, files: {} };

state.sessionId = localStorage.getItem("ts_session");
if (!state.sessionId) {
  state.sessionId = "s_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("ts_session", state.sessionId);
}
const el = (id) => document.getElementById(id);
const runsEl = () => el("runs");
const fmtSize = (b) => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(0) + " KB" : (b/1048576).toFixed(1) + " MB";

// ---------- markdown ----------
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inlineMd(s){ s=esc(s);
  s=s.replace(/`([^`]+)`/g,(_,c)=>"<code>"+c+"</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s; }
function renderMd(text){
  const lines=text.split("\n"); let html="", i=0;
  while(i<lines.length){ let line=lines[i];
    if(/^```/.test(line)){let c=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){c.push(lines[i]);i++;}i++;html+="<pre><code>"+esc(c.join("\n"))+"</code></pre>";continue;}
    if(line.includes("|")&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes("-")){
      const pr=(r)=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
      const hd=pr(line); i+=2; let rows=[]; while(i<lines.length&&lines[i].includes("|")){rows.push(pr(lines[i]));i++;}
      html+="<table><thead><tr>"+hd.map(h=>"<th>"+inlineMd(h)+"</th>").join("")+"</tr></thead><tbody>"+
        rows.map(r=>"<tr>"+r.map(c=>"<td>"+inlineMd(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>"; continue; }
    let m=line.match(/^(#{1,3})\s+(.*)$/); if(m){const l=m[1].length;html+=`<h${l}>`+inlineMd(m[2])+`</h${l}>`;i++;continue;}
    if(/^>\s?/.test(line)){let q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++;}html+="<blockquote>"+inlineMd(q.join(" "))+"</blockquote>";continue;}
    if(/^\s*[-*]\s+/.test(line)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inlineMd(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\d+\.\s+/.test(line)){let it=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*\d+\.\s+/,""));i++;}html+="<ol>"+it.map(x=>"<li>"+inlineMd(x)+"</li>").join("")+"</ol>";continue;}
    if(line.trim()===""){i++;continue;}
    let p=[line];i++; while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,3}\s|[-*]\s|\d+\.\s|>|```)/.test(lines[i])&&!lines[i].includes("|")){p.push(lines[i]);i++;}
    html+="<p>"+inlineMd(p.join("\n"))+"</p>";
  } return html;
}

// ---------- nav ----------
function renderNav(){
  const nav=el("nav"); nav.innerHTML="";
  const groups=[["Review & extract", state.skills.filter(s=>s.type==="workshop")],
                ["Ask", state.skills.filter(s=>s.type==="prompt")]];
  for(const [label, items] of groups){
    if(!items.length) continue;
    const l=document.createElement("div"); l.className="group-label"; l.textContent=label; nav.appendChild(l);
    for(const s of items){
      const d=document.createElement("div");
      d.className="tool"+(state.current&&state.current.id===s.id?" active":"");
      d.innerHTML=`<span class="emoji">${s.emoji}</span><div><div class="name">${s.name}</div><div class="tag">${s.produces_files?"Files in → files out":"Text answer"}</div></div>`;
      d.onclick=()=>selectSkill(s.id); nav.appendChild(d);
    }
  }
}

// ---------- skill form ----------
function selectSkill(id){
  const s=state.skills.find(x=>x.id===id); if(!s) return;
  state.current=s; state.runCount=0; state.files={};
  el("tEmoji").textContent=s.emoji; el("tName").textContent=s.name; el("tBlurb").textContent=s.blurb;
  el("tPill").textContent = s.produces_files ? "Files in → files out" : "Text answer";
  buildForm(s); runsEl().innerHTML=""; showEmptyHint(); renderNav();
}

function buildForm(s){
  const f=el("form"); f.innerHTML="";
  for(const inp of (s.inputs||[])){
    state.files[inp.key]=[];
    const field=document.createElement("div"); field.className="field";
    field.innerHTML=`
      <div class="field-label">${esc(inp.label)} ${inp.required?'<span class="req">required</span>':''}</div>
      <div class="field-help">${esc(inp.help||"")}</div>
      <div class="drop" data-key="${inp.key}">
        <div class="icon">📤</div>
        <div class="lead"><b>Choose files</b> or drop them here</div>
        <div class="sub">${inp.accept ? esc(inp.accept.replace(/\./g,"").toUpperCase()) : "Any file type"}${inp.multiple?" · multiple":""}</div>
      </div>
      <div class="filelist" data-list="${inp.key}"></div>
      <input type="file" data-input="${inp.key}" ${inp.multiple?"multiple":""} ${inp.accept?`accept="${inp.accept}"`:""} style="display:none">`;
    f.appendChild(field);
  }
  // instructions
  const instr=document.createElement("div"); instr.className="field";
  instr.innerHTML=`<div class="field-label">Context / instructions</div>
    <textarea id="instr" placeholder="${esc(s.instructions_placeholder||"Add any context or instructions…")}"></textarea>`;
  f.appendChild(instr);
  // foot
  const foot=document.createElement("div"); foot.className="form-foot";
  foot.innerHTML=`<button class="run" id="runBtn">Run ▸</button>
    ${s.deliverable?`<span class="deliverable">You'll get: <b>${esc(s.deliverable)}</b></span>`:""}
    <button class="clear" id="clearBtn" style="display:none">Clear runs</button>`;
  f.appendChild(foot);
  // examples
  if((s.starters||[]).length){
    const ex=document.createElement("div"); ex.className="examples";
    ex.innerHTML=`<div class="lbl">Example instructions</div><div class="chips">`+
      s.starters.map((t,i)=>`<button class="chip" data-i="${i}">${esc(t)}</button>`).join("")+`</div>`;
    f.appendChild(ex);
    ex.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{el("instr").value=s.starters[b.dataset.i];el("instr").focus();});
  }
  wireForm();
  el("runBtn").onclick=run;
  el("clearBtn").onclick=clearRuns;
}

function wireForm(){
  document.querySelectorAll(".drop").forEach(drop=>{
    const key=drop.dataset.key;
    const input=document.querySelector(`input[data-input="${key}"]`);
    drop.onclick=()=>input.click();
    drop.ondragover=(e)=>{e.preventDefault();drop.classList.add("over");};
    drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=(e)=>{e.preventDefault();drop.classList.remove("over");addFiles(key,e.dataTransfer.files);};
    input.onchange=()=>{addFiles(key,input.files);input.value="";};
  });
}

function addFiles(key, fileList){
  const inp=state.current.inputs.find(i=>i.key===key);
  const arr=Array.from(fileList);
  state.files[key] = inp.multiple ? state.files[key].concat(arr) : arr.slice(0,1);
  renderFileList(key);
}
function renderFileList(key){
  const box=document.querySelector(`[data-list="${key}"]`); if(!box) return;
  box.innerHTML="";
  state.files[key].forEach((f,idx)=>{
    const row=document.createElement("div"); row.className="filerow";
    row.innerHTML=`<span>📎</span><span class="fn">${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span><button class="x" title="Remove">×</button>`;
    row.querySelector(".x").onclick=()=>{state.files[key].splice(idx,1);renderFileList(key);};
    box.appendChild(row);
  });
}

function showEmptyHint(){
  el("clearBtn") && (el("clearBtn").style.display="none");
  if(runsEl().querySelector(".card")) return;
  runsEl().innerHTML=`<div class="empty-hint">No runs yet — add your files and instructions above, then hit <strong>Run</strong>.</div>`;
}

// ---------- run ----------
function inputSummary(){
  const parts=[];
  for(const inp of (state.current.inputs||[])){
    const n=(state.files[inp.key]||[]).length;
    if(n) parts.push(`${n} ${inp.label.toLowerCase()}`);
  }
  const instr=(el("instr").value||"").trim();
  if(instr) parts.push("instructions");
  return parts;
}

function newCard(summary){
  const hint=runsEl().querySelector(".empty-hint"); if(hint) hint.remove();
  el("clearBtn").style.display="inline";
  if(!runsEl().querySelector(".runs-head")){ const h=document.createElement("div"); h.className="runs-head"; h.textContent="Runs"; runsEl().prepend(h); }
  state.runCount++;
  const card=document.createElement("div"); card.className="card";
  const chips=summary.map(s=>`<span class="ic">${esc(s)}</span>`).join("");
  card.innerHTML=`
    <div class="card-head">
      <span class="idx">RUN ${state.runCount}</span>
      <span class="brief-text">${summary.map(esc).join(" · ")||"run"}</span>
      <span class="status running"><span class="dot"></span>Working…</span>
    </div>
    <div class="card-body">
      <div class="card-inputs">${chips}</div>
      <div class="statusline"><span>Starting…</span></div>
      <div class="out"></div>
    </div>`;
  runsEl().querySelector(".runs-head").after(card);
  return card;
}

async function run(){
  if(state.running || !state.current) return;
  const s=state.current;
  // validate required inputs
  for(const inp of (s.inputs||[])){
    if(inp.required && !(state.files[inp.key]||[]).length){
      alert(`Please add: ${inp.label}`); return;
    }
  }
  const instr=(el("instr").value||"").trim();
  const anyFiles=(s.inputs||[]).some(i=>(state.files[i.key]||[]).length);
  if(!anyFiles && !instr){ alert("Add files or instructions to run."); return; }

  const fd=new FormData();
  fd.append("session_id", state.sessionId);
  fd.append("skill_id", s.id);
  fd.append("instructions", instr);
  for(const inp of (s.inputs||[])){
    for(const file of (state.files[inp.key]||[])) fd.append(inp.key, file, file.name);
  }

  const card=newCard(inputSummary());
  const statusline=card.querySelector(".statusline");
  const out=card.querySelector(".out");
  const status=card.querySelector(".status");

  state.running=true;
  const btn=el("runBtn"); btn.disabled=true; btn.innerHTML=`<span class="spin"></span>Running`;

  let acc="", started=false; const files=[];
  try{
    const resp=await fetch("/api/run",{method:"POST",body:fd});
    if(!resp.ok){ const t=await resp.text(); throw new Error(t||("HTTP "+resp.status)); }
    const reader=resp.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let idx;
      while((idx=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,idx); buf=buf.slice(idx+2);
        const line=chunk.replace(/^data: /,""); if(!line) continue;
        let ev; try{ev=JSON.parse(line);}catch{continue;}
        if(ev.type==="status"){ statusline.querySelector("span").textContent=ev.text; }
        else if(ev.type==="text"){
          if(!started){started=true; statusline.style.display="none"; acc="";}
          acc+=ev.text; out.innerHTML='<div class="md">'+renderMd(acc)+"</div>";
        } else if(ev.type==="file"){ files.push(ev); }
        else if(ev.type==="error"){
          statusline.style.display="none";
          out.innerHTML='<div class="md" style="color:var(--accent)">⚠️ '+esc(ev.message)+"</div>";
          status.className="status err"; status.innerHTML='<span class="dot"></span>Failed';
        }
      }
    }
  }catch(e){
    statusline.style.display="none";
    out.innerHTML='<div class="md" style="color:var(--accent)">⚠️ '+esc(String(e.message||e))+"</div>";
    status.className="status err"; status.innerHTML='<span class="dot"></span>Failed';
  }finally{
    if(files.length){
      const w=document.createElement("div"); w.className="files";
      w.innerHTML=`<div class="flabel">Returned files</div><div class="wrap"></div>`;
      const wrap=w.querySelector(".wrap");
      for(const f of files){
        const a=document.createElement("a"); a.className="file-chip";
        a.href="/api/files/"+encodeURIComponent(f.file_id); a.setAttribute("download",f.name);
        a.innerHTML=`<span>📎 ${esc(f.name)}</span><span class="dl">Download</span>`;
        wrap.appendChild(a);
      }
      card.querySelector(".card-body").appendChild(w);
    }
    if(!started && !out.querySelector(".md") && !status.classList.contains("err")){
      out.innerHTML='<div class="md" style="color:var(--muted)">(no text output)</div>';
    }
    if(status.classList.contains("running")){ status.className="status done"; status.innerHTML='<span class="dot"></span>Done'; }
    // clear uploaded files so a re-run starts fresh (the sandbox keeps them for follow-ups)
    for(const inp of (s.inputs||[])){ state.files[inp.key]=[]; renderFileList(inp.key); }
    state.running=false; btn.disabled=false; btn.innerHTML="Run ▸";
  }
}

async function clearRuns(){
  if(!state.current) return;
  await fetch("/api/reset",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:state.sessionId,skill_id:state.current.id})});
  state.runCount=0; runsEl().innerHTML=""; showEmptyHint();
}

// ---------- boot ----------
async function boot(){
  const resp=await fetch("/api/skills"); const data=await resp.json();
  state.skills=data.skills;
  if(!data.configured){ const b=el("banner"); b.style.display="block";
    b.textContent="⚠️ No ANTHROPIC_API_KEY configured on the server — runs will not work until it is set."; }
  renderNav();
  if(state.skills.length) selectSkill(state.skills[0].id);
}
boot();
</script>
